---
- name: Create catalog application directory
  ansible.builtin.file:
    path: /opt/catalog-service
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy catalog microservice from Ansible machine
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../backend/catalog-service/"
    dest: /opt/catalog-service/
    owner: root
    group: root
    mode: preserve

- name: Install production dependencies
  ansible.builtin.command: npm ci --omit=dev
  args:
    chdir: /opt/catalog-service
  become: true
  become_user: root

- name: Create Catalog environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: /opt/catalog-service/.env
    owner: root
    group: root
    mode: "0600"

- name: Start Catalog with PM2 as root
  ansible.builtin.shell: |
    if pm2 describe catalog-service >/dev/null 2>&1; then
      pm2 restart catalog-service
    else
      pm2 start src/index.js --name catalog-service
    fi
    pm2 save
  args:
    chdir: /opt/catalog-service
  become: true
  become_user: root
