
---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true

- name: Install Node.js and npm
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present

- name: Install PM2 globally
  community.general.npm:
    name: pm2
    global: true
    state: present

- name: Create Cart application directory
  ansible.builtin.file:
    path: /opt/cart-service
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy Cart microservice from Ansible machine
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../backend/cart-service/"
    dest: /opt/cart-service/
    owner: root
    group: root
    mode: preserve

- name: Install production dependencies
  ansible.builtin.command: npm ci --omit=dev
  args:
    chdir: /opt/cart-service
  become: true
  become_user: root

- name: Create Cart environment file
  ansible.builtin.template:
    src: app.env.j2
    dest: /opt/cart-service/.env
    owner: root
    group: root
    mode: "0600"

- name: Start Cart with PM2 as root
  ansible.builtin.shell: |
    if pm2 describe cart-service >/dev/null 2>&1; then
      pm2 restart cart-service
    else
      pm2 start src/index.js --name cart-service
    fi
    pm2 save
  args:
    chdir: /opt/cart-service
  become: true
  become_user: root
